                        <td>plqpf</td>

                        <td><input type="checkbox" name="act-con-plq" id="act-con-plq"></td>
                    </tr>
                    <tr>
                        <td>fut</td>

                    </tr>
                    <tr>
                        <th>PASS</th>

                        <th>Conj</th>
                        <th></th>
                        <th>Ind</th>
                        <th>Conj</th>
                    </tr>
                    <tr>
                        <td>prae</td>
                        <td><input type="checkbox" name="pas-ind-pra" id="pas-ind-pra"></td>
                        <td><input type="checkbox" name="pas-con-pra" id="pas-con-pra"></td>
                        <td>perf</td>

                    </tr>
                    <tr>
                        <td>imp</td>
                        <td><input type="checkbox" name="pas-ind-imp" id="pas-ind-imp"></td>
                        <td><input type="checkbox" name="pas-con-imp" id="pas-con-imp"></td>
                        <td>plqpf</td>
                        <td><input type="checkbox" name="pas-ind-plq" id="pas-ind-plq"></td>
                        <td><input type="checkbox" name="pas-con-plq" id="pas-con-plq"></td>
                    </tr>
                    <tr>
                        <td>fut</td>
                        <td><input type="checkbox" name="pas-ind-fut" id="pas-ind-fut"></td>

            </table>
            </div>
            <div>
            <label for="aantal">Hoeveel woorden:</label><br>
            <input type="number" name="aantal" id="aantal" value="1" min="1" required><br>
            </div>
            <button onclick="
                const checkboxes = document.querySelectorAll('td>input');
                const checkedValues = Array.from(checkboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.name);
                calculate(
                    document.getElementById('ww-kiezer').value,
                    ((checkedValues.length<20) ? checkedValues : ['all']),
                    document.getElementById('aantal').value
                )">Geef de werkwoorden!</button>
        </div>
        <div class="right">
            <div id="output"></div>
            <button id="copy" onclick="javascript:copy_text()">Kopieer</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
<!-- Select all script-->
<script>
    const selectAll = document.getElementById('selectAll');
    const cells = document.querySelectorAll('td>input');

    selectAll.addEventListener('change', () => {
        cells.forEach(cb => cb.checked = selectAll.checked);
    });

    cells.forEach(cb => {
        if (cb.disabled) return;
        cb.addEventListener('change', () => {
        const allChecked = [...cells].every(c => c.checked);
        const anyChecked = [...cells].some(c => c.checked);
        selectAll.checked = allChecked;
        selectAll.indeterminate = anyChecked && !allChecked;
        });
    });
</script>
<!-- Ww selectie script -->
<script>
  const select = document.getElementById('ww-kiezer');

  ww_lijst.forEach(verb => {
    const option = document.createElement('option');
    option.value = verb.inf;
    option.textContent = verb.inf + ' - ' + verb.rijtje;
    select.appendChild(option)
  });
</script>
</html>
